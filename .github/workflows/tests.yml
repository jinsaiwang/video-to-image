name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 不装 opencv / torch：测试只覆盖纯逻辑与张量预处理，
      # 用 numpy + Pillow 就够，几十秒跑完。
      - name: 安装（不装依赖）
        run: pip install --no-deps -e .

      - name: 安装测试依赖
        run: pip install numpy Pillow pytest

      - name: 运行测试
        run: pytest -v
