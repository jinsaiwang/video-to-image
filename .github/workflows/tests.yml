name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只装包本身、不装依赖：核心测试只覆盖纯逻辑（命名规则、调速映射），
      # 不需要 torch / OpenCV，几十秒就能跑完。
      - name: 安装（不装依赖）
        run: pip install --no-deps -e .

      - name: 安装 pytest
        run: pip install pytest

      - name: 运行测试
        run: pytest -v
