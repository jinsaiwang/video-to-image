<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频 → 透明连续帧</title>
<style>
  :root{
    --bg:#FAFAF8; --card:#FFFFFF; --line:#E5E3DC; --line-soft:#EFEEE8;
    --ink:#1F1F1D; --ink-2:#5F5E5A; --ink-3:#8C8A83;
    --accent:#185FA5; --accent-bg:#E6F1FB;
    --ok:#0F6E56; --ok-bg:#E1F5EE;
    --warn:#A32D2D; --warn-bg:#FCEBEB;
    --amber:#854F0B; --amber-bg:#FAEEDA;
    --r:12px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:940px; margin:0 auto; padding:32px 24px 64px}
  header{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:22px}
  #btnBack{align-self:center; margin-right:2px}
  .recent-list{display:flex; flex-wrap:wrap; gap:8px}
  .recent-item{display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px;
    cursor:pointer; font-family:inherit; text-align:left; transition:.12s; max-width:230px}
  .recent-item:hover{border-color:var(--accent); background:var(--accent-bg)}
  .rname{font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis;
         white-space:nowrap; max-width:100%}
  .rmeta{font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  h1{font-size:19px; font-weight:500; margin:0; letter-spacing:.2px}
  .meta{font-size:12px; color:var(--ink-3)}
  .meta b{font-weight:500; color:var(--ink-2)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
        padding:22px; margin-bottom:16px}
  .card.hidden{display:none}
  .card-title{font-size:13px; font-weight:500; color:var(--ink-2); margin:0 0 16px}

  /* 拖拽区 */
  #drop{
    border:1.5px dashed var(--line); border-radius:10px; padding:44px 20px;
    text-align:center; cursor:pointer; transition:.15s; background:#FCFCFB;
  }
  #drop:hover,#drop.on{border-color:var(--accent); background:var(--accent-bg)}
  #drop .big{font-size:15px; font-weight:500; margin-bottom:6px}
  #drop .sub{font-size:12px; color:var(--ink-3)}
  #file{display:none}

  .opts{display:flex; gap:26px; align-items:flex-start; margin-top:20px; flex-wrap:wrap}
  .opt-label{font-size:12px; color:var(--ink-3); margin-bottom:7px}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .seg button{
    border:0; background:#fff; color:var(--ink-2); font-size:13px; padding:7px 14px;
    cursor:pointer; font-family:inherit; border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent-bg); color:var(--accent); font-weight:500}
  input[type=number]{
    width:74px; padding:6px 9px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:13px; color:var(--ink);
  }
  .txt{
    padding:6px 9px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:13px; color:var(--ink); background:#fff;
  }
  .txt:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg)}
  .name-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .preview-name{
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
    font-size:12px; color:var(--accent); background:var(--accent-bg);
    padding:3px 8px; border-radius:6px; display:inline-block;
  }
  .hint{font-size:12px; color:var(--ink-3); margin-top:10px; line-height:1.5}

  .btn{
    border:1px solid var(--line); background:#fff; color:var(--ink); font-family:inherit;
    font-size:13px; padding:8px 16px; border-radius:8px; cursor:pointer; transition:.12s;
  }
  .btn:hover{border-color:#C9C6BC; background:#FCFCFB}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{background:#134E87}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.sm{padding:5px 11px; font-size:12px}

  /* 调速预览 */
  #drop.hidden{display:none}
  .filebar{display:flex; justify-content:space-between; align-items:center; gap:14px;
           padding:12px 14px; border:1px solid var(--line-soft); border-radius:10px;
           background:#FCFCFB; margin-bottom:18px}
  .fname{font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .fmeta{font-size:12px; color:var(--ink-3); margin-top:2px; font-variant-numeric:tabular-nums}
  .speed-row{display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; margin-bottom:20px}
  .speed-preview{position:relative; flex:0 0 auto; border:1px solid var(--line); border-radius:10px;
                 overflow:hidden; background:#fff; line-height:0}
  #preview{display:block; height:200px; width:auto; max-width:280px; object-fit:contain; background:#F7F7F5}
  .playbtn{position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
           background:rgba(255,255,255,.94); line-height:1.4; box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .speed-ctrl{flex:1; min-width:300px}
  .slider-row{display:flex; align-items:center; gap:12px; margin-top:14px}
  .slider-row input[type=range]{flex:1; accent-color:var(--accent); min-width:120px}
  .speed-val{font-size:13px; font-variant-numeric:tabular-nums; color:var(--accent);
             background:var(--accent-bg); padding:3px 10px; border-radius:6px; min-width:64px; text-align:center}
  .speed-info{font-size:12px; color:var(--ink-2); margin-top:12px; line-height:1.75}
  .speed-info b{font-weight:500; color:var(--ink)}
  .speed-info .hl{color:var(--accent)}
  .seg button{padding:6px 11px}

  /* 进度 */
  .stage-row{margin-bottom:18px}
  .stage-head{display:flex; justify-content:space-between; font-size:12px; margin-bottom:7px; color:var(--ink-2)}
  .stage-head .n{color:var(--ink-3); font-variant-numeric:tabular-nums}
  .bar{height:6px; background:var(--line-soft); border-radius:4px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--accent);
         border-radius:4px; transition:width .18s linear}
  .bar.done i{background:var(--ok)}

  .live{display:flex; gap:14px; align-items:center; margin:18px 0 4px;
        padding:14px; border:1px solid var(--line-soft); border-radius:10px; background:#FCFCFB}
  .thumb{
    width:64px; height:64px; flex:0 0 64px; border-radius:8px; overflow:hidden;
    background-image:linear-gradient(45deg,#EDECE6 25%,transparent 25%,transparent 75%,#EDECE6 75%),
                     linear-gradient(45deg,#EDECE6 25%,#fff 25%,#fff 75%,#EDECE6 75%);
    background-size:12px 12px; background-position:0 0,6px 6px;
    border:1px solid var(--line-soft); display:flex; align-items:center; justify-content:center;
  }
  .thumb img{width:100%; height:100%; object-fit:contain; display:block}
  .live-info{flex:1; min-width:0}
  .live-info .t{font-size:13px; font-weight:500; margin-bottom:3px}
  .live-info .s{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}

  #log{
    margin-top:14px; font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
    font-size:11.5px; color:var(--ink-3); max-height:104px; overflow-y:auto;
    background:#FCFCFB; border:1px solid var(--line-soft); border-radius:8px; padding:10px 12px;
    line-height:1.75;
  }
  #log div{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  /* 结果 */
  .player-wrap{position:relative; width:fit-content; max-width:100%; margin:0 auto;
               border:1px solid var(--line); border-radius:10px;
               overflow:hidden; background:#fff}
  #canvas{
    display:block; margin:0 auto;
    width:auto; height:auto;
    max-width:100%; max-height:600px;
    background-color:#fff;
    background-image:linear-gradient(45deg,#EDECE6 25%,transparent 25%,transparent 75%,#EDECE6 75%),
                     linear-gradient(45deg,#EDECE6 25%,#fff 25%,#fff 75%,#EDECE6 75%);
    background-size:18px 18px; background-position:0 0,9px 9px;
  }
  .controls{display:flex; align-items:center; gap:14px; padding:12px 4px 2px; flex-wrap:wrap}
  input[type=range]{flex:1; min-width:160px; accent-color:var(--accent)}
  .counter{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:82px; text-align:right}
  .actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
             gap:10px; margin-bottom:18px}
  .stat{padding:12px 14px; border-radius:10px; background:#FCFCFB; border:1px solid var(--line-soft)}
  .stat .k{font-size:11.5px; color:var(--ink-3); margin-bottom:2px}
  .stat .v{font-size:16px; font-weight:500; font-variant-numeric:tabular-nums}
  .stat.ok{background:var(--ok-bg); border-color:#C7E6DA}
  .stat.ok .v{color:var(--ok)}

  .banner{padding:12px 16px; border-radius:10px; font-size:13px; margin-bottom:16px}
  .banner.err{background:var(--warn-bg); color:var(--warn); border:1px solid #F3D2D2}
  .banner.wait{background:var(--amber-bg); color:var(--amber); border:1px solid #F0DEB8}
  .banner.hide{display:none}
  #loadingHint{font-size:12px; color:var(--ink-3); margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="btn sm" id="btnBack" style="display:none">← 返回</button>
    <h1>视频 → 透明连续帧</h1>
    <div class="meta" id="meta">正在读取环境…</div>
  </header>

  <div class="banner hide" id="banner"></div>

  <!-- 导入 -->
  <section class="card" id="sec-import">
    <div id="drop">
      <div class="big">拖入视频，或点击选择</div>
      <div class="sub">支持 mp4 / mov / mkv / webm，建议不超过 30 秒</div>
    </div>
    <input type="file" id="file" accept="video/*">

    <div id="setup" style="display:none">
      <div class="filebar">
        <div style="min-width:0">
          <div class="fname" id="fileName">—</div>
          <div class="fmeta" id="fileMeta">—</div>
        </div>
        <button class="btn sm" id="btnReselect">换一个</button>
      </div>

      <div class="speed-row">
        <div class="speed-preview">
          <video id="preview" playsinline muted loop></video>
          <button class="btn sm playbtn" id="btnPreview">播放预览</button>
        </div>
        <div class="speed-ctrl">
          <div class="opt-label">播放速度</div>
          <div class="seg" id="speedSeg">
            <button data-speed="0.25">0.25×</button>
            <button data-speed="0.5">0.5×</button>
            <button data-speed="1" class="on">1×</button>
            <button data-speed="1.5">1.5×</button>
            <button data-speed="2">2×</button>
            <button data-speed="3">3×</button>
            <button data-speed="4">4×</button>
          </div>
          <div class="slider-row">
            <input type="range" id="speedRange" min="0.25" max="4" step="0.05" value="1">
            <span class="speed-val" id="speedVal">1.00×</span>
          </div>
          <div class="speed-info" id="speedInfo"></div>
        </div>
      </div>
    </div>

    <div class="opts">
      <div>
        <div class="opt-label">抽帧方式</div>
        <div class="seg" id="modeSeg">
          <button data-mode="all" class="on">全部帧</button>
          <button data-mode="sample">均匀抽样</button>
        </div>
      </div>
      <div id="countBox" style="display:none">
        <div class="opt-label">抽取帧数</div>
        <input type="number" id="count" value="60" min="2" max="2000">
      </div>
    </div>

    <div class="opts" style="margin-top:18px">
      <div>
        <div class="opt-label">输出文件夹名</div>
        <input type="text" id="jobname" class="txt" style="width:210px" placeholder="留空则用视频文件名">
      </div>
      <div style="flex:1; min-width:300px">
        <div class="opt-label">帧文件名</div>
        <div class="name-row">
          <input type="text" id="prefix" class="txt" style="width:110px" value="frame_" maxlength="24">
          <select id="startSel" class="txt">
            <option value="0">编号从 0 起</option>
            <option value="1">编号从 1 起</option>
          </select>
          <select id="digitsSel" class="txt">
            <option value="3">3 位</option>
            <option value="4">4 位</option>
            <option value="6" selected>6 位</option>
          </select>
        </div>
        <div style="margin-top:9px; font-size:12px; color:var(--ink-3)">
          实际文件名：<span class="preview-name" id="namePreview">frame_000000.png</span>
          <span id="namePreviewMore" style="color:var(--ink-3)"></span>
        </div>
      </div>
    </div>
    <div class="hint" id="modeHint">
      逐帧全部导出，帧数与视频完全一致，能保住原始动画节奏。桌宠、表情包这类动图请用这个。
    </div>

    <div class="actions" style="margin-top:18px; align-items:center">
      <button class="btn primary" id="btnStart" disabled>开始处理</button>
      <span class="hint" id="startHint" style="margin:0">先选择一个视频</span>
    </div>

    <div id="recentWrap" style="display:none; margin-top:20px; padding-top:18px; border-top:1px solid var(--line-soft)">
      <div class="opt-label">最近任务 · 点击可重新打开</div>
      <div id="recentList" class="recent-list"></div>
    </div>
  </section>

  <!-- 运行 -->
  <section class="card hidden" id="sec-run">
    <p class="card-title" id="runTitle">处理中</p>

    <div class="stage-row">
      <div class="stage-head"><span>1 · 抽帧</span><span class="n" id="extractNum">0 / 0</span></div>
      <div class="bar" id="extractBar"><i></i></div>
    </div>

    <div class="stage-row">
      <div class="stage-head"><span>2 · 模型抠图</span><span class="n" id="matteNum">0 / 0</span></div>
      <div class="bar" id="matteBar"><i></i></div>
    </div>

    <div class="live" id="liveBox" style="display:none">
      <div class="thumb"><img id="liveThumb" alt=""></div>
      <div class="live-info">
        <div class="t" id="liveTitle">等待首帧…</div>
        <div class="s" id="liveSub">—</div>
      </div>
    </div>

    <div id="log"></div>

    <div class="actions">
      <button class="btn" id="btnCancel">停止</button>
    </div>
  </section>

  <!-- 结果 -->
  <section class="card hidden" id="sec-result">
    <p class="card-title">结果 · 拖动查看每一帧</p>

    <div class="stat-grid" id="stats"></div>
    <div id="namingInfo" style="font-size:12px;color:var(--ink-3);margin:-6px 0 16px"></div>

    <div class="player-wrap">
      <canvas id="canvas" width="720" height="960"></canvas>
    </div>

    <div class="controls">
      <button class="btn sm" id="btnPlay">播放</button>
      <input type="range" id="slider" min="0" max="0" value="0">
      <span class="counter" id="counter">0 / 0</span>
      <label class="counter" style="display:flex;align-items:center;gap:6px;min-width:auto">
        <input type="checkbox" id="showSrc"> 看原图
      </label>
    </div>
    <div id="loadingHint"></div>

    <div class="actions">
      <button class="btn primary" id="btnOpen">打开输出文件夹</button>
      <button class="btn" id="btnAgain">再处理一个视频</button>
    </div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const state = { jobId: null, total: 0, fps: 24, playing: false, frames: [],
                loaded: 0, es: null, view: 'import' };

// ---------- 环境信息 ----------
fetch('/api/info').then(r => r.json()).then(info => {
  $('#meta').innerHTML = `推理设备 <b>${info.device}</b> · torch ${info.torch}` +
    (info.model_exists ? '' : ' · <span style="color:#A32D2D">模型缺失</span>');
  if (!info.model_exists) showBanner('err', `没有找到模型权重：${info.model_dir}\\model.safetensors`);
}).catch(() => $('#meta').textContent = '无法连接本地服务');

function showBanner(kind, text) {
  const b = $('#banner');
  b.className = `banner ${kind}`;
  b.textContent = text;
}
function hideBanner() { $('#banner').className = 'banner hide'; }

// ---------- 视图路由：让浏览器返回键可用、刷新不丢状态 ----------
function setView(view, push = true) {
  state.view = view;
  $('#sec-import').classList.toggle('hidden', view !== 'import');
  $('#sec-run').classList.toggle('hidden', view !== 'run');
  $('#sec-result').classList.toggle('hidden', view !== 'result');
  $('#btnBack').style.display = view === 'import' ? 'none' : 'inline-flex';

  const url = view === 'import'
    ? location.pathname
    : `${location.pathname}?job=${encodeURIComponent(state.jobId)}`;
  if (push) {
    history.pushState({ view, job: state.jobId }, '', url);
  } else {
    history.replaceState({ view, job: state.jobId }, '', url);
  }
  if (view !== 'import' && state.jobId) {
    try { localStorage.setItem('matte_last_job', state.jobId); } catch (e) {}
  }
  if (view === 'import') loadRecent();
}

// 打开一个已有任务（历史恢复、点最近任务、浏览器前进后退都走这里）
function openJob(id, push = false) {
  state.jobId = id;
  return fetch(`/api/jobs/${encodeURIComponent(id)}`)
    .then(r => r.json())
    .then(job => {
      if (job.error || (!job.result && job.status !== 'running' && job.status !== 'queued')) {
        setView('import', push);
        return;
      }
      if (job.status === 'running' || job.status === 'queued') {
        $('#runTitle').textContent = `处理中 · ${job.name || job.id}`;
        $('#liveBox').style.display = 'flex';
        setView('run', push);
        connectSSE(id);
      } else {
        loadResult();
      }
    })
    .catch(() => setView('import', false));
}

function loadRecent() {
  fetch('/api/jobs').then(r => r.json()).then(d => {
    const list = (d.jobs || []).filter(j => j.status === 'done');
    if (!list.length) { $('#recentWrap').style.display = 'none'; return; }
    $('#recentWrap').style.display = 'block';
    $('#recentList').innerHTML = list.map(j => {
      const sp = j.speed && Math.abs(j.speed - 1) > 0.001 ? ` · ${j.speed}×` : '';
      const du = typeof j.duration === 'number' ? ` · ${j.duration.toFixed(2)} 秒` : '';
      return `<button class="recent-item" data-id="${encodeURIComponent(j.id)}">
        <span class="rname">${j.name}</span>
        <span class="rmeta">${j.frames ?? '?'} 帧${sp}${du}</span>
      </button>`;
    }).join('');
  }).catch(() => {});
}

$('#recentList').addEventListener('click', e => {
  const b = e.target.closest('.recent-item');
  if (b) openJob(decodeURIComponent(b.dataset.id), true);
});
$('#btnBack').addEventListener('click', () => setView('import', true));

window.addEventListener('popstate', () => {
  const id = new URLSearchParams(location.search).get('job');
  if (id) openJob(id, false); else setView('import', false);
});

// ---------- 抽帧方式切换 ----------
$('#modeSeg').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  [...$('#modeSeg').children].forEach(b => b.classList.toggle('on', b === btn));
  const all = btn.dataset.mode === 'all';
  $('#countBox').style.display = all ? 'none' : 'block';
  $('#modeHint').textContent = all
    ? '逐帧全部导出，帧数与视频完全一致，能保住原始动画节奏。桌宠、表情包这类动图请用这个。'
    : '从视频里均匀挑出固定张数。注意：帧数变少会压缩时间轴，播放时长会相应变短。';
});

// ---------- 命名预览 ----------
const pad = (n, d) => String(n).padStart(d, '0');
function cleanPrefix(v) {
  return (v || '').replace(/[\\/:*?"<>|]/g, '_');
}
function updateNamePreview() {
  const p = cleanPrefix($('#prefix').value) || 'frame_';
  const s = +$('#startSel').value;
  const d = +$('#digitsSel').value;
  $('#namePreview').textContent = p + pad(s, d) + '.png';
  $('#namePreviewMore').textContent = ` · ${p + pad(s + 1, d)}.png · ${p + pad(s + 2, d)}.png …`;
}
['#prefix', '#startSel', '#digitsSel'].forEach(sel => {
  $(sel).addEventListener('input', updateNamePreview);
  $(sel).addEventListener('change', updateNamePreview);
});
updateNamePreview();

// ---------- 选择视频 → 上传 → 调速预览 ----------
const drop = $('#drop'), fileInput = $('#file');
const picked = { file: null, info: null, url: null, speed: 1 };

function setSpeed(v) {
  v = Math.min(4, Math.max(0.25, +v || 1));
  picked.speed = v;
  $('#speedVal').textContent = v.toFixed(2) + '×';
  $('#speedRange').value = v;
  [...$('#speedSeg').children].forEach(b =>
    b.classList.toggle('on', Math.abs(+b.dataset.speed - v) < 0.001));
  const pv = $('#preview');
  if (pv) { pv.playbackRate = v; }
  updateSpeedInfo();
}

function updateSpeedInfo() {
  const info = picked.info;
  if (!info || !info.total_frames || !info.fps) { $('#speedInfo').textContent = ''; return; }
  const s = picked.speed;
  // 必须和后端 int(total / speed) 保持一致，否则预估帧数与实际产出差一帧
  const nf = Math.max(1, Math.floor(info.total_frames / s));
  const dur = nf / info.fps;
  let html = `原 <b>${info.duration.toFixed(2)} 秒 / ${info.total_frames} 帧</b>` +
             ` → 输出 <b class="hl">${dur.toFixed(2)} 秒 / ${nf} 帧</b>` +
             ` · ${info.fps.toFixed(0)} fps 不变`;
  if (s < 1) {
    html += `<br><span style="color:#854F0B">慢放是把同一画面连续重复，帧数翻倍但信息量不变；` +
            `需要真正的补帧（光流插值）要另做处理。</span>`;
  } else if (s > 1) {
    html += `<br><span style="color:var(--ink-3)">快放按比例抽掉中间帧，视频不重新编码，无画质损失。</span>`;
  }
  $('#speedInfo').innerHTML = html;
}

function prepareFile(file) {
  if (!file) return;
  if (!file.type.startsWith('video/') && !/\.(mp4|mov|mkv|webm|avi|m4v)$/i.test(file.name)) {
    showBanner('err', '这不是视频文件：' + file.name); return;
  }
  hideBanner();
  picked.file = file;
  if (picked.url) URL.revokeObjectURL(picked.url);
  picked.url = URL.createObjectURL(file);
  picked.info = null;

  const pv = $('#preview');
  pv.src = picked.url;
  pv.playbackRate = picked.speed;

  $('#drop').classList.add('hidden');
  $('#setup').style.display = 'block';
  $('#fileName').textContent = file.name;
  $('#fileMeta').textContent = `${(file.size / 1048576).toFixed(1)} MB · 上传中…`;
  $('#btnStart').disabled = true;
  $('#startHint').textContent = '上传中…';
  setView('import', false);

  fetch('/api/jobs?name=' + encodeURIComponent(file.name), { method: 'POST', body: file })
    .then(r => r.json())
    .then(d => {
      if (!d.job) throw new Error(d.error || '创建任务失败');
      state.jobId = d.job;
      picked.info = d.info || {};
      const i = picked.info;
      $('#fileMeta').textContent = i.total_frames
        ? `${(file.size / 1048576).toFixed(1)} MB · ${i.width}×${i.height} · ${i.fps.toFixed(0)} fps · ${i.duration.toFixed(2)} 秒 / ${i.total_frames} 帧`
        : `${(file.size / 1048576).toFixed(1)} MB · 无法读取帧信息`;
      setSpeed(picked.speed);
      $('#btnStart').disabled = false;
      $('#startHint').textContent = '确认速度与命名后点「开始处理」';
    })
    .catch(err => {
      showBanner('err', '上传失败：' + err.message);
      $('#btnStart').disabled = true;
      $('#startHint').textContent = '上传失败，请换一个视频';
    });
}

['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('on');
}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('on');
}));
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) prepareFile(f);
});
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) prepareFile(fileInput.files[0]);
});

$('#speedSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setSpeed(b.dataset.speed);
});
$('#speedRange').addEventListener('input', e => setSpeed(e.target.value));
$('#btnPreview').addEventListener('click', () => {
  const pv = $('#preview');
  pv.playbackRate = picked.speed;
  if (pv.paused) pv.play(); else pv.pause();
});
$('#preview').addEventListener('play', () => $('#btnPreview').textContent = '暂停');
$('#preview').addEventListener('pause', () => $('#btnPreview').textContent = '播放预览');
$('#btnReselect').addEventListener('click', () => fileInput.click());
$('#btnStart').addEventListener('click', startProcess);

function startProcess() {
  if (!state.jobId || !picked.file) return;
  const mode = $('#modeSeg').querySelector('.on').dataset.mode;
  const qs = new URLSearchParams({
    mode,
    count: $('#count').value || 60,
    speed: picked.speed,
    jobname: $('#jobname').value.trim(),
    prefix: cleanPrefix($('#prefix').value).trim() || 'frame_',
    start: $('#startSel').value,
    digits: $('#digitsSel').value,
  });

  setView('run', true);
  $('#runTitle').textContent = `处理中 · ${picked.file.name}`;
  $('#log').innerHTML = '';
  $('#liveBox').style.display = 'none';
  ['#matteBar', '#extractBar'].forEach(s => {
    $(s).classList.remove('done');
    $(s).querySelector('i').style.width = '0%';
  });
  state.extractLogged = false;
  addLog(`速度 ${picked.speed.toFixed(2)}× · ` +
         (mode === 'all' ? '全部帧' : `均匀抽样 ${$('#count').value || 60} 帧`));

  fetch(`/api/jobs/${encodeURIComponent(state.jobId)}/start?` + qs, { method: 'POST' })
    .then(r => r.json())
    .then(d => {
      if (d.error) throw new Error(d.error);
      // 改了任务名时服务端会重命名目录，任务 ID 随之变化，必须同步
      if (d.job) state.jobId = d.job;
      setView('run', false);
      addLog('任务已启动：' + state.jobId);
      connectSSE(state.jobId);
    })
    .catch(err => {
      showBanner('err', '启动失败：' + err.message);
      $('#sec-import').classList.remove('hidden');
      $('#sec-run').classList.add('hidden');
    });
}

function addLog(text) {
  const el = document.createElement('div');
  el.textContent = text;
  $('#log').appendChild(el);
  $('#log').scrollTop = $('#log').scrollHeight;
}

// ---------- SSE ----------
function connectSSE(jobId) {
  if (state.es) state.es.close();
  const es = new EventSource(`/api/jobs/${jobId}/events`);
  state.es = es;

  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.stage === 'hello') return;
    handleEvent(ev);
  };
  es.onerror = () => { /* 完成或断开，由事件流自己收尾 */ };
}

let matteTimes = [];
function handleEvent(ev) {
  const { stage } = ev;
  if (stage === 'start' || stage === 'probe') {
    addLog(ev.msg || '开始');
  }
  if (stage === 'extract') {
    const t = ev.total || 0;
    const pct = t ? Math.min(100, ev.done / t * 100) : 0;
    $('#extractBar').querySelector('i').style.width = pct + '%';
    $('#extractNum').textContent = t ? `${ev.done} / ${t}` : `${ev.done} / ?`;
    if (ev.done === ev.total && ev.total > 0 && !state.extractLogged) {
      state.extractLogged = true;
      $('#extractBar').classList.add('done');
      addLog(ev.msg && ev.msg.includes('完成') ? ev.msg : `抽帧完成，共 ${ev.done} 帧`);
    }
  }
  if (stage === 'load_model') {
    $('#liveBox').style.display = 'flex';
    $('#liveTitle').textContent = '加载模型';
    $('#liveSub').textContent = '首次加载约 7 秒，之后复用';
    if (ev.done >= ev.total) addLog(ev.msg);
  }
  if (stage === 'matte') {
    const t = ev.total || 1;
    $('#matteBar').querySelector('i').style.width = Math.min(100, ev.done / t * 100) + '%';
    $('#matteNum').textContent = `${ev.done} / ${t}`;
    $('#liveBox').style.display = 'flex';

    if (ev.ms > 0) matteTimes.push(ev.ms);
    if (matteTimes.length > 25) matteTimes.shift();
    const avg = matteTimes.length ? matteTimes.reduce((a, b) => a + b, 0) / matteTimes.length : 0;
    const left = (t - ev.done) * avg / 1000;
    $('#liveTitle').textContent = `第 ${ev.done} / ${t} 帧`;
    $('#liveSub').textContent = avg
      ? `${avg | 0} ms/帧 · 剩余约 ${left > 60 ? (left / 60).toFixed(1) + ' 分' : Math.ceil(left) + ' 秒'}`
      : '';

    if (ev.index !== undefined && ev.index >= 0) {
      const img = $('#liveThumb');
      const src = `/api/jobs/${state.jobId}/frame?i=${ev.index}&kind=alpha&w=128`;
      if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; }
    }
    if (ev.msg && ev.ms === -1) addLog(ev.msg);
  }
  if (stage === 'done' || stage === 'cancelled' || stage === 'error') {
    if (stage === 'error') {
      showBanner('err', '出错了：' + (ev.msg || '未知错误'));
      addLog(ev.msg || '');
      if (ev.traceback) addLog(ev.traceback.split('\n').slice(-4).join(' '));
      return;
    }
    $('#matteBar').classList.add('done');
    addLog(ev.msg || stage);
    // 用户已经返回到导入页时，不要突然把他拽回结果页
    if (state.view === 'run') setTimeout(() => loadResult(), 300);
    else loadRecent();
  }
}

// ---------- 结果展示 ----------
function loadResult() {
  fetch(`/api/jobs/${state.jobId}`).then(r => r.json()).then(job => {
    if (!job.result) {
      if (job.status === 'cancelled') { addLog('任务已取消，已完成的帧保留在输出目录'); }
      return;
    }
    const r = job.result;
    state.total = r.frames;
    state.fps = r.fps || 24;

    setView('result', state.view === 'run');

    $('#stats').innerHTML = `
      <div class="stat ok"><div class="k">透明帧</div><div class="v">${r.frames} 张</div></div>
      <div class="stat"><div class="k">源视频</div><div class="v">${r.source_total} 帧 · ${r.fps} fps${r.speed && Math.abs(r.speed - 1) > 0.001 ? ` · ${r.speed}×` : ''}</div></div>
      <div class="stat"><div class="k">输出时长</div><div class="v">${(r.frames / r.fps).toFixed(2)} 秒</div></div>
      <div class="stat"><div class="k">耗时</div><div class="v">${Math.round(r.matte.elapsed)} 秒</div></div>`;

    const n = r.naming || {};
    if (n.first) {
      $('#namingInfo').innerHTML =
        `输出命名：<span class="preview-name">${n.first}</span>` +
        (n.first !== n.last ? ` → <span class="preview-name">${n.last}</span>` : '') +
        ` ｜ 文件夹：<b style="font-weight:500;color:var(--ink-2)">jobs\\${job.dir.split(/[\\/]/).pop()}</b>`;
    }

    const cv = $('#canvas');
    cv.width = 720; cv.height = 960;
    $('#slider').max = state.total - 1;
    $('#slider').value = 0;
    updateCounter(0);
    preloadFrames();
  });
}

function frameUrl(i, w) {
  const kind = $('#showSrc').checked ? 'src' : 'alpha';
  return `/api/jobs/${state.jobId}/frame?i=${i}&kind=${kind}&w=${w}`;
}

function preloadFrames() {
  state.frames = new Array(state.total);
  state.loaded = 0;
  $('#loadingHint').textContent = `加载帧 0 / ${state.total}`;
  let idx = 0;
  const loadNext = () => {
    if (idx >= state.total) { $('#loadingHint').textContent = ''; return; }
    const i = idx++;
    const img = new Image();
    img.onload = img.onerror = () => {
      state.frames[i] = img;
      state.loaded++;
      if (state.loaded % 12 === 0 || state.loaded === state.total)
        $('#loadingHint').textContent = state.loaded < state.total
          ? `加载帧 ${state.loaded} / ${state.total}` : '';
      if (i === 0) draw(0);
      loadNext();
    };
    img.src = frameUrl(i, 480);
  };
  for (let k = 0; k < 6; k++) loadNext();   // 并发 6 路，避免瞬时 241 个请求
}

function draw(i) {
  const cv = $('#canvas'), ctx = cv.getContext('2d');
  const img = state.frames[i];
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (img && img.complete && img.naturalWidth) {
    if (cv.width !== img.naturalWidth) { cv.width = img.naturalWidth; cv.height = img.naturalHeight; }
    const s = Math.min(cv.width / img.naturalWidth, cv.height / img.naturalHeight);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.drawImage(img, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
  }
  updateCounter(i);
}

function updateCounter(i) {
  $('#counter').textContent = `${i + 1} / ${state.total}`;
  $('#slider').value = i;
}

$('#slider').addEventListener('input', e => {
  stopPlay(); draw(+e.target.value);
});
$('#showSrc').addEventListener('change', () => {
  const cur = +$('#slider').value;
  state.loaded = 0; preloadFrames(); draw(cur);
});

// ---------- 播放 ----------
let rafId = null, playStart = 0, playFrom = 0;
function startPlay() {
  if (state.playing) return;
  state.playing = true;
  playFrom = +$('#slider').value;
  playStart = performance.now();
  $('#btnPlay').textContent = '暂停';
  const loop = now => {
    if (!state.playing) return;
    const el = (now - playStart) / 1000;
    let fi = (playFrom + Math.floor(el * state.fps)) % state.total;
    draw(fi);
    rafId = requestAnimationFrame(loop);
  };
  rafId = requestAnimationFrame(loop);
}
function stopPlay() {
  state.playing = false;
  $('#btnPlay').textContent = '播放';
  if (rafId) cancelAnimationFrame(rafId);
}
$('#btnPlay').addEventListener('click', () => state.playing ? stopPlay() : startPlay());

// ---------- 操作 ----------
$('#btnCancel').addEventListener('click', () => {
  if (!state.jobId) return;
  fetch(`/api/jobs/${state.jobId}/cancel`, { method: 'POST' });
  addLog('已请求停止');
});
$('#btnOpen').addEventListener('click', () => {
  fetch(`/api/jobs/${state.jobId}/open`, { method: 'POST' });
});
$('#btnAgain').addEventListener('click', () => {
  stopPlay();
  if (state.es) state.es.close();
  state.jobId = null; state.total = 0; state.loaded = 0; state.frames = [];
  $('#file').value = '';
  setView('import', true);
  $('#matteBar').classList.remove('done');
  $('#extractBar').classList.remove('done');
  picked.file = null; picked.info = null;
  const pv = $('#preview');
  pv.pause(); pv.removeAttribute('src'); pv.load();
  $('#drop').classList.remove('hidden');
  $('#setup').style.display = 'none';
  $('#btnStart').disabled = true;
  $('#startHint').textContent = '先选择一个视频';
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !$('#sec-result').classList.contains('hidden')) {
    e.preventDefault(); state.playing ? stopPlay() : startPlay();
  }
  if (e.key === 'ArrowRight' && state.total) { stopPlay(); draw(Math.min(state.total - 1, +$('#slider').value + 1)); }
  if (e.key === 'ArrowLeft' && state.total) { stopPlay(); draw(Math.max(0, +$('#slider').value - 1)); }
});

// 启动：优先按 URL 里的 ?job= 打开，其次恢复上次看过的任务
(function boot() {
  const id = new URLSearchParams(location.search).get('job');
  if (id) { openJob(id, false); return; }

  let last = null;
  try { last = localStorage.getItem('matte_last_job'); } catch (e) {}
  if (last) {
    openJob(last, false);
  } else {
    setView('import', false);
  }
})();
</script>
</body>
</html>
